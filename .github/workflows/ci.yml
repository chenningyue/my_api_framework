  name: API 接口自动化 CI

  # 什么时候触发
  on:
    push:                          # 每次 push 到 main
      branches: [main]
    pull_request:                  # 每次提 PR 到 main
      branches: [main]
    schedule:                      # 定时跑：每天北京时间凌晨 2 点（UTC 18:00）
      - cron: '0 18 * * *'

  jobs:
    test:
      runs-on: ubuntu-latest       # CI 跑在 GitHub 的一台 Linux 机器上
      steps:
        - name: 拉代码
          uses: actions/checkout@v4

        - name: 装 Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: 装依赖
          run: pip install -r requirements.txt

        - name: 跑测试 + 出报告
          run: pytest --html=report.html --self-contained-html

        - name: 保存报告（测试红了也保留）
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: pytest-report
            path: |
              report.html
              log.txt